<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログイン</title>

  <style>
    /* ページ全体 */
    body {
      font-family: "Yu Gothic", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;

      background-image: url("img/titleback.png");
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    }

    /* 白い枠 */
    .container {
      width: 420px;
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      text-align: center;
    }

    img {
      width: 100%;
      max-width: 641px;
      height: auto;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    h1 {
      margin-bottom: 25px;
      color: #333;
    }

    label {
      display: block;
      text-align: left;
      margin-top: 15px;
      font-weight: bold;
    }

    select,
    input {
      width: 100%;
      padding: 8px 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #4a90e2;
      color: white;
      cursor: pointer;
      transition: .3s;
    }

    button:hover {
      background-color: #357ab8;
    }
  </style>

</head>

<body>

<div class="container">

  <img src="img/title.png" alt="タイトル画像">

  <h1>ログイン（サインイン）</h1>

  <form id="userForm">

    <label for="department">学部</label>

    <select id="department" required>
      <option value="">選択してください</option>
      <option value="F1">F1</option>
      <option value="F2">F2</option>
      <option value="F3">F3</option>
      <option value="F4">F4</option>
      <option value="J2">J2</option>
      <option value="J4">J4</option>
    </select>

    <label for="class">クラス</label>

    <select id="class" required>
      <option value="">選択してください</option>
      <option value="1">1組</option>
      <option value="2">2組</option>
      <option value="3">3組</option>
      <option value="4">4組</option>
      <option value="5">5組</option>
      <option value="6">6組</option>
      <option value="7">7組</option>
      <option value="8">8組</option>
    </select>

    <label for="number">番号</label>

    <select id="number" required>
      <option value="">選択してください</option>
    </select>

    <label for="name">名前</label>

    <input
      type="text"
      id="name"
      placeholder="名前を入力してください"
      required
    >

    <button type="submit">開始</button>

  </form>

</div>

<script>

  /* -----------------------
     番号を1～30番まで生成
  ----------------------- */

  const numberSelect = document.getElementById("number");

  for (let i = 1; i <= 30; i++) {

    const option = document.createElement("option");

    option.value = i;
    option.textContent = i + "番";

    numberSelect.appendChild(option);

  }

  /* -----------------------
     ログイン
  ----------------------- */

  document.getElementById("userForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const userInfo = {

      department: document.getElementById("department").value,

      class: document.getElementById("class").value,

      number: document.getElementById("number").value,

      name: document.getElementById("name").value.trim()

    };

    if (
      !userInfo.department ||
      !userInfo.class ||
      !userInfo.number ||
      !userInfo.name
    ) {
      alert("すべての項目を入力してください。");
      return;
    }

    /* ローカルへ保存（次回はExcelへ変更予定） */

    localStorage.setItem(
      "userInfo",
      JSON.stringify(userInfo)
    );

    /* 教材開始 */

    window.location.href = "1-a.html";

  });

</script>

</body>
</html>
